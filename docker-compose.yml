
services: 
  nginx: 
    image: nginx:alpine 
    container_name: nginx
    ports: 
      - "8080:80"
      - "443:443" 
    volumes: 
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf 
      - ./certs:/etc/letsencrypt 
    working_dir: /var/www/html
    depends_on: 
      - laravel 
    restart: always 
    networks:
      - laravel-network
  laravel: 
    build: 
      context: . 
      dockerfile: Dockerfile 
    container_name: laravel
    environment: 
      APP_ENV: local
      APP_DEBUG: true
      REDIS_HOST: redis 
      REDIS_PORT: 6379 
      CACHE_STORE: redis 
      SESSION_DRIVER: redis 
      QUEUE_CONNECTION: redis 
    volumes: 
      - .:/var/www/html
      - ./docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini
    depends_on: 
      - redis 
    restart: always 
    networks:
      - laravel-network
 
  redis: 
    image: redis:7-alpine 
    container_name: redis
    command: redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru 
    restart: always 
    networks:
      - laravel-network

networks:
  laravel-network:
    driver: bridge