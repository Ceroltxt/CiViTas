services:
  nginx:
    image: nginx:alpine
    container_name: nginx-prod
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/production.conf:/etc/nginx/conf.d/default.conf
      - ./certs:/etc/letsencrypt
    depends_on:
      laravel:
        condition: service_started
    restart: always
    networks:
      - laravel-network

  laravel:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: laravel-prod
    env_file:
      - .env
    environment:
      APP_ENV: production
      APP_DEBUG: false
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CACHE_STORE: redis
      SESSION_DRIVER: redis
      QUEUE_CONNECTION: redis
    volumes:
      - .:/var/www/html
    depends_on:
      redis:
        condition: service_started
    restart: always
    networks:
      - laravel-network

  postgres:
    image: postgres:16-alpine
    container_name: postgres-prod
    profiles:
      - local-db
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${DB_DATABASE:-civitas}
      POSTGRES_USER: ${DB_USERNAME:-civitas}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-civitas}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-civitas} -d ${DB_DATABASE:-civitas}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: always
    networks:
      - laravel-network

  redis:
    image: redis:7-alpine
    container_name: redis-prod
    command: redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru
    restart: always
    networks:
      - laravel-network

networks:
  laravel-network:
    driver: bridge

volumes:
  postgres_prod_data:
